<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرر البلوكات التفاعلية — BajoZone</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #0a0a0a; --paper: #ffffff; --gold: #c8a86e; --gold-dim: #a8885a;
  --warm-mid: #666; --warm-dark: #333; --line: #e5e5e5; --line-s: #f0f0f0;
  --off-white: #fafafa; --error: #dc3545; --success: #28a745;
  --ff: 'Tajawal', 'Segoe UI', sans-serif; --ff-mono: 'Consolas', 'Courier New', monospace;
}
body { font-family: var(--ff); background: var(--off-white); color: var(--ink); min-height: 100vh; }

/* ── Auth Screen ── */
#auth-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.auth-box { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:2.5rem; width:100%; max-width:380px; }
.auth-logo { font-size:1.5rem; font-weight:900; color:var(--ink); margin-bottom:1.5rem; letter-spacing:-.02em; }
.auth-logo span { color:var(--gold); }
.auth-err { color:var(--error); font-size:.85rem; margin-bottom:.75rem; display:none; }
.auth-err.show { display:block; }

/* ── App Shell ── */
#app-screen { display:none; }
.topbar { background:var(--ink); color:#fff; padding:.75rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; position:sticky; top:0; z-index:100; }
.topbar-brand { font-weight:900; font-size:1rem; letter-spacing:-.02em; }
.topbar-brand span { color:var(--gold); }
.topbar-right { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }

/* ── Layout ── */
.layout { display:grid; grid-template-columns:320px 1fr; gap:1.5rem; padding:1.5rem; max-width:1400px; margin:0 auto; }
@media(max-width:900px) { .layout { grid-template-columns:1fr; } }

/* ── Panels ── */
.panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.panel-header { padding:.875rem 1.25rem; border-bottom:1px solid var(--line); font-weight:700; font-size:.875rem; display:flex; align-items:center; gap:.5rem; background:var(--off-white); }
.panel-body { padding:1rem; }

/* ── Article Picker ── */
.art-search { width:100%; padding:.55rem .75rem; border:1px solid var(--line); border-radius:6px; font-family:var(--ff); font-size:.875rem; margin-bottom:.75rem; }
.art-list { max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:.35rem; }
.art-item { padding:.6rem .75rem; border-radius:6px; cursor:pointer; font-size:.8rem; transition:background .15s; border:1px solid transparent; }
.art-item:hover { background:var(--off-white); }
.art-item.active { background:color-mix(in srgb, var(--gold) 10%, transparent); border-color:var(--gold); }
.art-item-title { font-weight:600; color:var(--ink); }
.art-item-meta  { color:var(--warm-mid); font-size:.75rem; margin-top:.15rem; }

/* ── Type selector ── */
.type-selector { display:flex; gap:.5rem; margin-bottom:1rem; }
.type-btn { flex:1; padding:.5rem; border:1px solid var(--line); border-radius:6px; background:var(--paper); cursor:pointer; font-family:var(--ff); font-size:.8rem; font-weight:600; transition:all .15s; }
.type-btn.active-type { background:var(--ink); color:#fff; border-color:var(--ink); }

/* ── Block List ── */
.block-list { display:flex; flex-direction:column; gap:.5rem; min-height:80px; }
.block-row { display:flex; align-items:center; gap:.5rem; padding:.6rem .75rem; border:1px solid var(--line); border-radius:8px; background:var(--paper); cursor:grab; }
.block-row:active { cursor:grabbing; }
.block-row.drag-over { border-color:var(--gold); background:color-mix(in srgb, var(--gold) 6%, var(--paper)); }
.block-handle { color:var(--warm-mid); font-size:1rem; cursor:grab; flex-shrink:0; }
.block-badge { background:var(--off-white); border:1px solid var(--line); border-radius:4px; font-size:.7rem; font-family:var(--ff-mono); padding:.15rem .45rem; flex-shrink:0; color:var(--warm-dark); }
.block-label { flex:1; font-size:.8rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.block-actions { display:flex; gap:.3rem; flex-shrink:0; }

/* ── Buttons ── */
.btn { padding:.5rem 1rem; border:none; border-radius:6px; cursor:pointer; font-family:var(--ff); font-size:.8rem; font-weight:600; transition:background .15s; }
.btn-primary { background:var(--gold); color:#fff; }
.btn-primary:hover { background:var(--gold-dim); }
.btn-ghost  { background:transparent; border:1px solid var(--line); color:var(--ink); }
.btn-ghost:hover { background:var(--off-white); }
.btn-danger { background:transparent; border:1px solid var(--error); color:var(--error); }
.btn-danger:hover { background:#fff5f5; }
.btn-sm { padding:.3rem .6rem; font-size:.75rem; }
.btn-icon { padding:.3rem .5rem; font-size:.9rem; line-height:1; }
.btn-save { background:var(--ink); color:#fff; }
.btn-save:hover { background:#222; }

/* ── Add block bar ── */
.add-block-bar { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.75rem; }
.add-block-btn { padding:.35rem .7rem; border:1px dashed var(--line); border-radius:6px; background:var(--paper); cursor:pointer; font-family:var(--ff); font-size:.75rem; color:var(--warm-dark); transition:all .15s; }
.add-block-btn:hover { border-color:var(--gold); color:var(--gold); }

/* ── Block editor form ── */
.block-editor { margin-top:.75rem; }
.block-editor-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem; }
.block-editor-title { font-weight:700; font-size:.875rem; }

.form-group { margin-bottom:.875rem; }
.form-label { display:block; font-size:.78rem; font-weight:600; margin-bottom:.3rem; color:var(--warm-dark); }
.form-input, .form-select, .form-textarea {
  width:100%; padding:.5rem .75rem; border:1px solid var(--line); border-radius:6px;
  font-family:var(--ff); font-size:.85rem; background:var(--paper); color:var(--ink);
}
.form-textarea { min-height:90px; resize:vertical; font-family:var(--ff-mono); font-size:.8rem; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline:none; border-color:var(--gold); }

/* ── Array field ── */
.array-field { display:flex; flex-direction:column; gap:.4rem; }
.array-item { display:flex; gap:.4rem; align-items:flex-start; }
.array-item .form-input { flex:1; }
.add-item-btn { font-size:.75rem; color:var(--gold); background:none; border:none; cursor:pointer; padding:.25rem 0; font-family:var(--ff); font-weight:600; text-align:start; }

/* ── JSON import ── */
.import-section { border:1px solid var(--line); border-radius:8px; padding:.875rem; }
.import-section-header { font-size:.8rem; font-weight:700; margin-bottom:.6rem; }
.import-actions { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem; }
.import-msg { font-size:.78rem; margin-top:.4rem; }
.import-msg.ok  { color:var(--success); }
.import-msg.err { color:var(--error); }

/* ── Status bar ── */
.status-bar { margin-top:.75rem; font-size:.8rem; min-height:1.5rem; }
.status-bar.ok  { color:var(--success); }
.status-bar.err { color:var(--error); }

.empty-state { color:var(--warm-mid); font-size:.8rem; text-align:center; padding:1.5rem 0; }

/* ── Drag placeholder ── */
.drag-placeholder { border:2px dashed var(--gold); border-radius:8px; height:44px; opacity:.4; background:color-mix(in srgb, var(--gold) 5%, transparent); }

/* ── Scrollbar ── */
.art-list::-webkit-scrollbar { width:4px; }
.art-list::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
</style>
</head>
<body>

<!-- ── Auth Screen ─────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Bajo<span>Zone</span> Admin</div>
    <p style="font-size:.85rem;color:var(--warm-mid);margin-bottom:1.25rem;">تسجيل الدخول للوصول إلى محرر البلوكات التفاعلية</p>
    <div id="auth-err" class="auth-err">بيانات الدخول غير صحيحة.</div>
    <div class="form-group">
      <label class="form-label" for="auth-email">البريد الإلكتروني</label>
      <input class="form-input" type="email" id="auth-email" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label" for="auth-pass">كلمة المرور</label>
      <input class="form-input" type="password" id="auth-pass" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- ── App Shell ───────────────────────────────── -->
<div id="app-screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="/admin/" style="color:rgba(255,255,255,.6);font-size:.8rem;text-decoration:none;white-space:nowrap;" title="العودة إلى لوحة التحكم">← لوحة التحكم</a>
      <div class="topbar-brand">Bajo<span>Zone</span> · محرر البلوكات</div>
    </div>
    <div class="topbar-right">
      <span id="topbar-article-name" style="font-size:.78rem;color:rgba(255,255,255,.55);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:#444" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="layout">
    <!-- ── Right panel: article picker ── -->
    <aside>
      <div class="panel">
        <div class="panel-header">📰 اختر المقالة</div>
        <div class="panel-body">
          <input class="art-search" type="search" placeholder="ابحث..." id="art-search" oninput="filterArticles()">
          <div class="art-list" id="art-list">
            <div class="empty-state">جار التحميل...</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ── Main: block editor ── -->
    <main>
      <div id="no-article-msg" class="panel" style="padding:2rem;text-align:center;color:var(--warm-mid);">
        اختر مقالة من القائمة لبدء تحرير البلوكات
      </div>

      <div id="editor-panel" style="display:none">
        <div class="panel" style="margin-bottom:1rem;">
          <div class="panel-header" id="selected-article-name">—</div>
          <div class="panel-body">
            <!-- Article type -->
            <div class="form-group">
              <label class="form-label">نوع المقالة</label>
              <div class="type-selector">
                <button class="type-btn active-type" data-type="standard"  onclick="setArticleType('standard')">عادية</button>
                <button class="type-btn"             data-type="interactive" onclick="setArticleType('interactive')">تفاعلية</button>
                <button class="type-btn"             data-type="report"    onclick="setArticleType('report')">تقرير</button>
              </div>
            </div>

            <!-- Add block bar -->
            <div class="form-group">
              <label class="form-label">إضافة بلوك</label>
              <div class="add-block-bar">
                <button class="add-block-btn" onclick="addBlock('stat_cards')">📊 إحصائيات</button>
                <button class="add-block-btn" onclick="addBlock('chart')">📈 رسم بياني</button>
                <button class="add-block-btn" onclick="addBlock('timeline')">🕐 جدول زمني</button>
                <button class="add-block-btn" onclick="addBlock('insight_cards')">💡 بطاقات</button>
                <button class="add-block-btn" onclick="addBlock('comparison_table')">⚖️ مقارنة</button>
                <button class="add-block-btn" onclick="addBlock('method_note')">📌 ملاحظة</button>
                <button class="add-block-btn" onclick="addBlock('source_box')">📚 مصادر</button>
                <button class="add-block-btn" onclick="addBlock('accordion')">🗂 أكورديون</button>
              </div>
            </div>

            <!-- Block list -->
            <div class="form-group">
              <label class="form-label">البلوكات (<span id="block-count">0</span>)</label>
              <div class="block-list" id="block-list"></div>
            </div>

            <!-- Inline block editor -->
            <div class="block-editor" id="block-editor" style="display:none">
              <div class="block-editor-header">
                <div class="block-editor-title" id="block-editor-title">تحرير البلوك</div>
                <button class="btn btn-ghost btn-sm" onclick="closeBlockEditor()">✕ إغلاق</button>
              </div>
              <div id="block-editor-body"></div>
            </div>

            <!-- Save button + status -->
            <div style="display:flex;gap:.75rem;align-items:center;margin-top:1rem;flex-wrap:wrap;">
              <button class="btn btn-save" onclick="saveBlocks()">💾 حفظ البلوكات</button>
              <div class="status-bar" id="save-status"></div>
            </div>
          </div>
        </div>

        <!-- JSON import section -->
        <div class="panel">
          <div class="panel-header">📥 استيراد JSON</div>
          <div class="panel-body">
            <div class="import-section">
              <div class="import-section-header">الصق كائن JSON يحتوي على مصفوفة "blocks"</div>
              <textarea class="form-textarea" id="import-json" style="min-height:140px;direction:ltr" placeholder='{"article_type":"interactive","blocks":[...]}'></textarea>
              <div class="import-actions">
                <button class="btn btn-ghost btn-sm" onclick="validateImportJson()">✔ تحقق</button>
                <button class="btn btn-primary btn-sm" onclick="importJsonReplace()">استبدال</button>
                <button class="btn btn-ghost btn-sm" onclick="importJsonAppend()">إضافة</button>
                <button class="btn btn-ghost btn-sm" onclick="loadSampleJson()">مثال</button>
              </div>
              <div class="import-msg" id="import-msg"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
/* ── State ──────────────────────────────────────────────────────── */
let token      = sessionStorage.getItem('bzt') || '';
let allArticles = [];
let selectedId  = null;
let articleType = 'standard';
let blocks      = [];        // [{id, type, order, data}]
let editingIdx  = null;      // index in blocks[]
let dragSrcIdx  = null;

/* ── Auth ────────────────────────────────────────────────────────── */
async function doLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  const err   = document.getElementById('auth-err');
  err.classList.remove('show');
  try {
    const r = await fetch('/api/auth.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    });
    const j = await r.json();
    if (!r.ok || !j.token) throw new Error(j.error || 'Auth failed');
    token = j.token;
    sessionStorage.setItem('bzt', token);
    showApp();
  } catch (e) {
    err.textContent = e.message === 'Auth failed' ? 'بيانات الدخول غير صحيحة.' : e.message;
    err.classList.add('show');
  }
}

document.getElementById('auth-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function showAuthScreen(msg) {
  token = '';
  sessionStorage.removeItem('bzt');
  document.getElementById('app-screen').style.display  = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  if (msg) {
    const err = document.getElementById('auth-err');
    err.textContent = msg;
    err.classList.add('show');
  }
}

function doLogout() { showAuthScreen(); }

function apiHeaders() {
  return { 'Content-Type': 'application/json', 'X-Admin-Token': token };
}

/* ── Boot ────────────────────────────────────────────────────────── */
if (token) {
  showApp();
} else {
  document.getElementById('auth-screen').style.display = 'flex';
}

async function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display  = 'block';
  await loadArticles();
  const urlId = new URLSearchParams(location.search).get('article_id');
  if (urlId) await selectArticle(urlId);
}

async function loadArticles() {
  try {
    const r = await fetch('/api/admin-content.php', { headers: apiHeaders() });
    if (r.status === 401) { showAuthScreen('انتهت الجلسة. الرجاء تسجيل الدخول مجدداً.'); return; }
    const j = await r.json();
    allArticles = (j.articles || []).map(a => ({
      id:    a.id,
      title: a.title_ar || a.title || a.title_en || a.id,
      status: a.status || 'published',
    }));
    renderArtList(allArticles);
  } catch(e) {
    document.getElementById('art-list').innerHTML = `<div class="empty-state">فشل تحميل المقالات</div>`;
  }
}

function renderArtList(arts) {
  const el = document.getElementById('art-list');
  if (!arts.length) { el.innerHTML = `<div class="empty-state">لا توجد مقالات</div>`; return; }
  el.innerHTML = arts.map(a => `
    <div class="art-item ${a.id === selectedId ? 'active' : ''}" onclick="selectArticle('${esc(a.id)}')">
      <div class="art-item-title">${escHtml(a.title)}</div>
      <div class="art-item-meta">${escHtml(a.id)} · ${a.status}</div>
    </div>`).join('');
}

function filterArticles() {
  const q = document.getElementById('art-search').value.toLowerCase();
  renderArtList(q ? allArticles.filter(a => a.title.toLowerCase().includes(q) || a.id.toLowerCase().includes(q)) : allArticles);
}

/* ── Article selection ───────────────────────────────────────────── */
async function selectArticle(id) {
  selectedId = id;
  filterArticles();
  document.getElementById('no-article-msg').style.display  = 'none';
  document.getElementById('editor-panel').style.display    = 'block';

  const art = allArticles.find(a => a.id === id);
  const artTitle = art ? art.title : id;
  document.getElementById('selected-article-name').textContent = artTitle;

  // Keep topbar in sync when article came from URL param
  const tb = document.getElementById('topbar-article-name');
  if (tb) tb.textContent = artTitle;

  // Scroll article into view in the list
  const activeItem = document.querySelector('.art-item.active');
  if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });

  closeBlockEditor();
  setStatus('');

  try {
    const r = await fetch(`/api/blocks.php?article_id=${encodeURIComponent(id)}`, { headers: apiHeaders() });
    if (r.status === 401) { showAuthScreen('انتهت الجلسة. الرجاء تسجيل الدخول مجدداً.'); return; }
    const j = await r.json();
    articleType = j.article_type || 'standard';
    blocks = (j.blocks || []).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    updateTypeButtons();
    renderBlockList();
  } catch(e) {
    setStatus('فشل تحميل البلوكات: ' + e.message, true);
  }
}

/* ── Article type ────────────────────────────────────────────────── */
function setArticleType(t) {
  articleType = t;
  updateTypeButtons();
}

function updateTypeButtons() {
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.classList.toggle('active-type', btn.dataset.type === articleType);
  });
}

/* ── Block list rendering ────────────────────────────────────────── */
const BLOCK_LABELS = {
  stat_cards: 'إحصائيات', chart: 'رسم بياني', timeline: 'جدول زمني',
  insight_cards: 'بطاقات', comparison_table: 'مقارنة', method_note: 'ملاحظة',
  source_box: 'مصادر', accordion: 'أكورديون',
};

function renderBlockList() {
  const el = document.getElementById('block-list');
  document.getElementById('block-count').textContent = blocks.length;
  if (!blocks.length) { el.innerHTML = `<div class="empty-state">لا توجد بلوكات — أضف بلوكًا أو استورد JSON</div>`; return; }

  el.innerHTML = blocks.map((blk, i) => {
    const label = blk.data.title || blk.data.body?.slice(0, 40) || BLOCK_LABELS[blk.type] || blk.type;
    return `<div class="block-row" draggable="true"
      data-idx="${i}"
      ondragstart="onDragStart(event,${i})"
      ondragover="onDragOver(event,${i})"
      ondrop="onDrop(event,${i})"
      ondragend="onDragEnd(event)">
      <span class="block-handle">⠿</span>
      <span class="block-badge">${escHtml(blk.type)}</span>
      <span class="block-label">${escHtml(label)}</span>
      <div class="block-actions">
        <button class="btn btn-ghost btn-icon btn-sm" title="تحرير"    onclick="openBlockEditor(${i})">✎</button>
        <button class="btn btn-ghost btn-icon btn-sm" title="تكرار"    onclick="duplicateBlock(${i})">⧉</button>
        <button class="btn btn-danger btn-icon btn-sm" title="حذف"    onclick="deleteBlock(${i})">✕</button>
      </div>
    </div>`;
  }).join('');
}

/* ── Drag & drop reorder ─────────────────────────────────────────── */
function onDragStart(e, idx) { dragSrcIdx = idx; e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e, idx) {
  e.preventDefault();
  document.querySelectorAll('.block-row').forEach(r => r.classList.remove('drag-over'));
  if (idx !== dragSrcIdx) document.querySelectorAll('.block-row')[idx]?.classList.add('drag-over');
}
function onDrop(e, idx) {
  e.preventDefault();
  if (dragSrcIdx === null || dragSrcIdx === idx) return;
  const moved = blocks.splice(dragSrcIdx, 1)[0];
  blocks.splice(idx, 0, moved);
  blocks.forEach((b, i) => b.order = i);
  renderBlockList();
  if (editingIdx !== null) {
    editingIdx = editingIdx === dragSrcIdx ? idx : null;
    if (editingIdx === null) closeBlockEditor();
  }
}
function onDragEnd() {
  document.querySelectorAll('.block-row').forEach(r => r.classList.remove('drag-over'));
  dragSrcIdx = null;
}

/* ── Block CRUD ──────────────────────────────────────────────────── */
function addBlock(type) {
  const defaults = {
    stat_cards:       { title: '', cards: [{ value: '', label: '', change: '', change_dir: '' }] },
    chart:            { title: '', chartType: 'bar', labels: [''], datasets: [{ label: '', data: [0] }], caption: '' },
    timeline:         { title: '', items: [{ date: '', title: '', body: '' }] },
    insight_cards:    { title: '', cards: [{ icon: '', title: '', body: '', tone: '' }] },
    comparison_table: { title: '', columns: ['الخاصية', 'القيمة'], rows: [['', '']] },
    method_note:      { title: '', body: '', tone: 'gold', icon: '📌' },
    source_box:       { title: '', items: [{ label: '', url: '' }] },
    accordion:        { title: '', items: [{ question: '', answer: '' }] },
  };
  const blk = { id: 'new_' + Date.now(), type, order: blocks.length, data: JSON.parse(JSON.stringify(defaults[type])) };
  blocks.push(blk);
  renderBlockList();
  openBlockEditor(blocks.length - 1);
}

function duplicateBlock(idx) {
  const orig = blocks[idx];
  const copy = { id: 'new_' + Date.now(), type: orig.type, order: blocks.length, data: JSON.parse(JSON.stringify(orig.data)) };
  blocks.push(copy);
  renderBlockList();
}

function deleteBlock(idx) {
  if (!confirm('حذف هذا البلوك؟')) return;
  blocks.splice(idx, 1);
  blocks.forEach((b, i) => b.order = i);
  if (editingIdx === idx) closeBlockEditor();
  renderBlockList();
}

/* ── Block editor ────────────────────────────────────────────────── */
function openBlockEditor(idx) {
  editingIdx = idx;
  const blk = blocks[idx];
  document.getElementById('block-editor').style.display = 'block';
  document.getElementById('block-editor-title').textContent = `تحرير: ${BLOCK_LABELS[blk.type] || blk.type}`;
  document.getElementById('block-editor-body').innerHTML = buildEditorForm(blk.type, blk.data, idx);
}

function closeBlockEditor() {
  editingIdx = null;
  document.getElementById('block-editor').style.display = 'none';
}

function buildEditorForm(type, data, idx) {
  const fg = (label, input) => `<div class="form-group"><label class="form-label">${label}</label>${input}</div>`;
  const inp = (field, val, label) => fg(label, `<input class="form-input" type="text" value="${escAttr(val)}" oninput="updateField(${idx},'${field}',this.value)">`);
  const sel = (field, val, label, opts) => fg(label, `<select class="form-select" onchange="updateField(${idx},'${field}',this.value)">${opts.map(([v,t]) => `<option value="${v}" ${val===v?'selected':''}>${t}</option>`).join('')}</select>`);

  switch(type) {
    case 'stat_cards':
      return inp('title', data.title||'', 'العنوان (اختياري)') + buildArrayEditor(idx, 'cards', data.cards||[], [
        {f:'value', l:'القيمة'},{f:'label',l:'الوسم'},{f:'change',l:'التغيّر'},{f:'change_dir',l:'الاتجاه (up/down/flat)'}
      ]);

    case 'chart':
      return inp('title',data.title||'','العنوان') +
        sel('chartType',data.chartType||'bar','نوع الرسم',[['bar','أعمدة'],['line','خطي'],['doughnut','دائري مجوف'],['pie','فطيرة']]) +
        fg('التسميات (مفصولة بفاصلة)', `<input class="form-input" type="text" value="${escAttr((data.labels||[]).join(','))}" oninput="updateLabels(${idx},this.value)">`) +
        fg('البيانات (مفصولة بفاصلة)', `<input class="form-input" type="text" value="${escAttr(((data.datasets||[{}])[0]?.data||[]).join(','))}" oninput="updateChartData(${idx},this.value)">`) +
        fg('وسم المجموعة', `<input class="form-input" type="text" value="${escAttr((data.datasets||[{}])[0]?.label||'')}" oninput="updateChartLabel(${idx},this.value)">`) +
        inp('caption',data.caption||'','التعليق أسفل الرسم') +
        fg('إظهار الأسطورة', `<input type="checkbox" ${data.showLegend?'checked':''} onchange="updateField(${idx},'showLegend',this.checked)">`);

    case 'timeline':
      return inp('title',data.title||'','العنوان') + buildArrayEditor(idx,'items',data.items||[],[
        {f:'date',l:'التاريخ'},{f:'title',l:'العنوان'},{f:'body',l:'النص'}
      ]);

    case 'insight_cards':
      return inp('title',data.title||'','العنوان') + buildArrayEditor(idx,'cards',data.cards||[],[
        {f:'icon',l:'الأيقونة'},{f:'title',l:'العنوان'},{f:'body',l:'النص'},{f:'tone',l:'اللون (success/warning/danger/info/gold/dark)'}
      ]);

    case 'comparison_table':
      return inp('title',data.title||'','العنوان') +
        fg('الأعمدة (مفصولة بفاصلة)',`<input class="form-input" type="text" value="${escAttr((data.columns||[]).join(','))}" oninput="updateColumns(${idx},this.value)">`) +
        `<div class="form-group"><label class="form-label">الصفوف (كل صف = JSON مصفوفة)</label>
          <div id="table-rows-${idx}">${buildTableRows(idx,data)}</div>
          <button class="add-item-btn" onclick="addTableRow(${idx})">+ إضافة صف</button></div>`;

    case 'method_note':
      return inp('title',data.title||'','العنوان') +
        fg('النص',`<textarea class="form-textarea" oninput="updateField(${idx},'body',this.value)">${escHtml(data.body||'')}</textarea>`) +
        sel('tone',data.tone||'gold','النبرة',[['default','افتراضي'],['success','نجاح'],['warning','تحذير'],['danger','خطأ'],['info','معلومة'],['gold','ذهبي'],['dark','داكن']]) +
        inp('icon',data.icon||'','الأيقونة (emoji)');

    case 'source_box':
      return inp('title',data.title||'','العنوان') + buildArrayEditor(idx,'items',data.items||[],[
        {f:'label',l:'النص'},{f:'url',l:'الرابط'}
      ]);

    case 'accordion':
      return inp('title',data.title||'','العنوان') + buildArrayEditor(idx,'items',data.items||[],[
        {f:'question',l:'السؤال'},{f:'answer',l:'الجواب'}
      ]);

    default: return `<div class="form-group"><label class="form-label">بيانات JSON</label>
      <textarea class="form-textarea" oninput="updateRaw(${idx},this.value)">${escHtml(JSON.stringify(data,null,2))}</textarea></div>`;
  }
}

function buildArrayEditor(idx, field, items, fields) {
  const rows = items.map((item, i) => {
    const inputs = fields.map(({f,l}) =>
      `<input class="form-input" style="flex:1;min-width:100px" type="text" placeholder="${escAttr(l)}" value="${escAttr(item[f]??'')}" oninput="updateArrayField(${idx},'${field}',${i},'${f}',this.value)">`
    ).join('');
    return `<div class="array-item">${inputs}<button class="btn btn-danger btn-icon btn-sm" onclick="removeArrayItem(${idx},'${field}',${i})">✕</button></div>`;
  }).join('');
  return `<div class="form-group"><label class="form-label">${field === 'cards' ? 'البطاقات' : field === 'items' ? 'العناصر' : field}</label>
    <div class="array-field" id="arr-${idx}-${field}">${rows}</div>
    <button class="add-item-btn" onclick="addArrayItem(${idx},'${field}')">+ إضافة عنصر</button></div>`;
}

function buildTableRows(idx, data) {
  return (data.rows||[]).map((row, ri) =>
    `<div class="array-item"><input class="form-input" type="text" style="direction:ltr" value="${escAttr(JSON.stringify(row))}" oninput="updateTableRow(${idx},${ri},this.value)"><button class="btn btn-danger btn-icon btn-sm" onclick="removeTableRow(${idx},${ri})">✕</button></div>`
  ).join('');
}

/* ── Field update helpers ────────────────────────────────────────── */
function updateField(idx, field, val) {
  blocks[idx].data[field] = val;
}
function updateLabels(idx, val) {
  blocks[idx].data.labels = val.split(',').map(s => s.trim());
}
function updateChartData(idx, val) {
  if (!blocks[idx].data.datasets) blocks[idx].data.datasets = [{}];
  blocks[idx].data.datasets[0].data = val.split(',').map(s => Number(s.trim()) || 0);
}
function updateChartLabel(idx, val) {
  if (!blocks[idx].data.datasets) blocks[idx].data.datasets = [{}];
  blocks[idx].data.datasets[0].label = val;
}
function updateColumns(idx, val) {
  blocks[idx].data.columns = val.split(',').map(s => s.trim());
}
function updateRaw(idx, val) {
  try { blocks[idx].data = JSON.parse(val); } catch(e) {}
}
function updateArrayField(idx, field, i, key, val) {
  if (!blocks[idx].data[field]) blocks[idx].data[field] = [];
  if (!blocks[idx].data[field][i]) blocks[idx].data[field][i] = {};
  blocks[idx].data[field][i][key] = val;
}
function addArrayItem(idx, field) {
  if (!blocks[idx].data[field]) blocks[idx].data[field] = [];
  blocks[idx].data[field].push({});
  openBlockEditor(idx);
}
function removeArrayItem(idx, field, i) {
  blocks[idx].data[field].splice(i, 1);
  openBlockEditor(idx);
}
function updateTableRow(idx, ri, val) {
  try {
    blocks[idx].data.rows[ri] = JSON.parse(val);
  } catch(e) {
    blocks[idx].data.rows[ri] = val.split(',').map(s => s.trim());
  }
}
function addTableRow(idx) {
  const cols = (blocks[idx].data.columns||[]).length || 2;
  if (!blocks[idx].data.rows) blocks[idx].data.rows = [];
  blocks[idx].data.rows.push(Array(cols).fill(''));
  openBlockEditor(idx);
}
function removeTableRow(idx, ri) {
  blocks[idx].data.rows.splice(ri, 1);
  openBlockEditor(idx);
}

/* ── Save ────────────────────────────────────────────────────────── */
async function saveBlocks() {
  if (!selectedId) return;
  setStatus('جار الحفظ...');
  const payload = {
    article_id:   selectedId,
    article_type: articleType,
    blocks: blocks.map((blk, i) => ({ type: blk.type, order: i, data: blk.data })),
  };
  try {
    const r = await fetch('/api/blocks.php', {
      method: 'POST',
      headers: apiHeaders(),
      body: JSON.stringify(payload),
    });
    if (r.status === 401) { showAuthScreen('انتهت الجلسة. الرجاء تسجيل الدخول مجدداً.'); return; }
    const j = await r.json();
    if (!r.ok) {
      const msg = j.errors ? j.errors.join('\n') : (j.error || 'فشل الحفظ');
      setStatus(msg, true);
    } else {
      setStatus(`✔ تم الحفظ — ${j.blocks_saved} بلوك`, false);
    }
  } catch(e) {
    setStatus('خطأ: ' + e.message, true);
  }
}

function setStatus(msg, isErr = false) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.className = 'status-bar' + (msg ? (isErr ? ' err' : ' ok') : '');
}

function loadSampleJson() {
  document.getElementById('import-json').value = JSON.stringify(SAMPLE_JSON, null, 2);
  document.getElementById('import-msg').textContent = '';
}

function parseImportJson() {
  const raw = document.getElementById('import-json').value.trim();
  try {
    const parsed = JSON.parse(raw);
    const blks   = parsed.blocks || parsed;
    if (!Array.isArray(blks)) throw new Error('المصفوفة "blocks" غير موجودة.');
    const ALLOWED = ['stat_cards','chart','timeline','insight_cards','comparison_table','method_note','source_box','accordion'];
    for (const b of blks) {
      if (!b.type) throw new Error('كل بلوك يجب أن يحتوي على حقل "type".');
      if (!ALLOWED.includes(b.type)) throw new Error(`نوع البلوك غير مدعوم: ${b.type}`);
    }
    return { ok: true, parsed, blks };
  } catch(e) {
    return { ok: false, error: e.message };
  }
}

function validateImportJson() {
  const result = parseImportJson();
  const msg = document.getElementById('import-msg');
  if (result.ok) {
    msg.className = 'import-msg ok';
    msg.textContent = `✔ JSON صحيح — ${result.blks.length} بلوك`;
  } else {
    msg.className = 'import-msg err';
    msg.textContent = '✕ ' + result.error;
  }
}

function importJsonReplace() {
  const result = parseImportJson();
  const msg = document.getElementById('import-msg');
  if (!result.ok) { msg.className='import-msg err'; msg.textContent='✕ '+result.error; return; }
  if (result.parsed.article_type) setArticleType(result.parsed.article_type);
  blocks = result.blks.map((b, i) => ({ id: 'new_'+Date.now()+'_'+i, type: b.type, order: b.order ?? i, data: b.data || {} }));
  closeBlockEditor(); renderBlockList();
  msg.className='import-msg ok'; msg.textContent=`✔ تم استبدال البلوكات — ${blocks.length} بلوك`;
}

function importJsonAppend() {
  const result = parseImportJson();
  const msg = document.getElementById('import-msg');
  if (!result.ok) { msg.className='import-msg err'; msg.textContent='✕ '+result.error; return; }
  const start = blocks.length;
  result.blks.forEach((b, i) => blocks.push({ id: 'new_'+Date.now()+'_'+i, type: b.type, order: start+i, data: b.data || {} }));
  renderBlockList();
  msg.className='import-msg ok'; msg.textContent=`✔ تمت الإضافة — الإجمالي: ${blocks.length} بلوك`;
}

/* ── Utils ───────────────────────────────────────────────────────── */
function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(str) { return escHtml(str); }
function esc(str) { return String(str ?? '').replace(/'/g,"\\'"); }
